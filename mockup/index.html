<title>Filmlab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: darkroom app — preview stage left, tool panel right, filmstrip carousel along the bottom; stacks on phones */
:root{
  color-scheme:dark;
  --bg:#0f0e0d;
  --stage:#0a0908;
  --panel:#171513;
  --raise:#211e1b;
  --line:#2f2a25;
  --fg:#ece5d9;
  --muted:#968c80;
  --accent:#f0c04a;      /* edge-print yellow */
  --accent-ink:#1b1608;
  --ovr:#6cc4d8;         /* per-item override */
  --warn:#e8664a;
  --ui:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"top top" "stage panel" "strip panel";gap:12px;padding-inline:16px;padding-block:12px;box-sizing:border-box}

/* top bar */
.top{grid-area:top;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-weight:800;font-stretch:72%;font-size:22px;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brand i{width:14px;height:20px;border:2px solid var(--accent);border-radius:2px;position:relative}
.brand i::after{content:"";position:absolute;inset:3px 2px;background:var(--accent)}
.folder{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.folder b{font-weight:600}
.folder span{color:var(--muted);font-size:12px;font-family:var(--mono)}
.top .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--raise);border-radius:8px;padding:8px 12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#4a433b}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.ghost{background:transparent}
.btn.small{padding:5px 9px;font-size:12px}
.btn[disabled]{opacity:.4;cursor:default}

/* stage */
.stage{grid-area:stage;position:relative;background:var(--stage);border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:0;
  background-image:radial-gradient(circle at 50% 50%,#16130f 0,var(--stage) 70%)}
#view{max-width:calc(100% - 32px);max-height:calc(100% - 96px);box-shadow:0 10px 40px #0008;touch-action:none}
.stage.picking #view{cursor:crosshair}
.chips{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 24px);pointer-events:none}
.chip{font-size:11px;font-family:var(--mono);padding:3px 8px;border-radius:99px;background:#000a;border:1px solid var(--line);letter-spacing:.04em}
.chip.g{color:var(--accent);border-color:#5a4a1e}
.chip.o{color:var(--ovr);border-color:#24525c}
.chip.b{color:var(--fg);background:var(--warn);border-color:var(--warn)}
.stagebar{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stagebar .sp{flex:1}
.tc{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.hold{user-select:none;-webkit-user-select:none;touch-action:none}

/* filmstrip */
.strip{grid-area:strip;min-width:0;display:flex;flex-direction:column;gap:6px}
.striphead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.striphead b{color:var(--fg);font-weight:600}
.striphead .sp{flex:1}
.reel{display:flex;gap:0;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;background:#050504;border-radius:6px}
.frame{flex:none;position:relative;border:0;background:#050504;padding:14px 5px;display:block}
.frame::before,.frame::after{content:"";position:absolute;left:0;right:0;height:8px;
  background:repeating-linear-gradient(90deg,transparent 0 5px,#2a2520 5px 11px,transparent 11px 16px);background-position:2px 0}
.frame::before{top:3px}.frame::after{bottom:3px}
.frame canvas{display:block;width:108px;height:72px;border-radius:2px;outline:2px solid transparent;outline-offset:2px;transition:outline-color .15s}
.frame.on canvas{outline-color:var(--accent)}
.frame .no{position:absolute;left:8px;bottom:0;background:#050504;padding:0 4px;line-height:14px;font:500 9px var(--mono);color:#b58d2e;letter-spacing:.06em}
.frame .ov{position:absolute;right:8px;top:18px;width:8px;height:8px;border-radius:50%;background:var(--ovr);box-shadow:0 0 0 2px #050504}
.frame .vid{position:absolute;left:9px;top:17px;font:500 10px var(--mono);background:#000b;padding:1px 5px;border-radius:3px}
.frame .vid.t{color:var(--accent)}
.frame.add{width:118px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px}
.frame.add span{font-size:24px;line-height:1}

/* panel */
.panel{grid-area:panel;background:var(--panel);border-radius:10px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.scope{padding:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:8px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:6px;padding:7px 6px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--raise);color:var(--fg)}
.seg button.on[data-scope=item]{color:var(--ovr)}
.seg button.on[data-scope=all]{color:var(--accent)}
.scopenote{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;justify-content:space-between;min-height:26px}
.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:8px 9px 10px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--fg);border-color:var(--accent)}
.tabs button.vid{color:var(--accent)}
.tabs button[hidden]{display:none}
.body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:14px;min-height:0}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h3{margin:0;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;font-stretch:90%}
.sec h3 em{font-style:normal;font-family:var(--mono);letter-spacing:0;text-transform:none;color:#6d655c;font-weight:400}

.row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center}
.row label{font-size:13px;display:flex;align-items:center;gap:6px;cursor:default;user-select:none}
.row label .d{width:6px;height:6px;border-radius:50%;background:var(--ovr);visibility:hidden}
.row.ovr label .d{visibility:visible}
.row output{font:12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.row.ovr output{color:var(--ovr)}
.row input{grid-column:1/-1}
.row small{grid-column:1/-1;font-size:11px;color:var(--ovr);margin-top:-2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;--a:50%;--b:50%}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--line) var(--a),var(--accent) var(--a) var(--b),var(--line) var(--b))}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--line) var(--a),var(--accent) var(--a) var(--b),var(--line) var(--b))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--fg);margin-top:-6.5px;border:3px solid var(--panel)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--fg);border:3px solid var(--panel)}
.scope-item input[type=range]::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--line) var(--a),var(--ovr) var(--a) var(--b),var(--line) var(--b))}
.scope-item input[type=range]::-moz-range-track{background:linear-gradient(90deg,var(--line) var(--a),var(--ovr) var(--a) var(--b),var(--line) var(--b))}

select{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.looks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.look{border:0;background:transparent;padding:0;display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);text-align:left;min-width:0}
.look canvas{width:100%;aspect-ratio:3/2;border-radius:4px;outline:2px solid transparent;outline-offset:1px;max-width:100%}
.look.on canvas{outline-color:var(--accent)}
.look.on{color:var(--fg)}
.look span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.curvewrap{position:relative}
#curve{width:100%;aspect-ratio:1;display:block;background:var(--bg);border-radius:6px;touch-action:none;max-width:100%}
.chans{display:flex;gap:6px}
.chans button{flex:1;border:1px solid var(--line);background:var(--raise);border-radius:6px;padding:5px 0;font:600 12px var(--mono)}
.chans button.on{border-color:currentColor}
.chans button[data-c=r]{color:#ff6a5a}.chans button[data-c=g]{color:#6fd27c}.chans button[data-c=b]{color:#6aa6ff}
.hint{font-size:11px;color:#6d655c}

.bands{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.band{aspect-ratio:1;border-radius:50%;border:2px solid transparent;padding:0;position:relative;max-width:100%}
.band.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--panel) inset}
.band.mod::after{content:"";position:absolute;right:-2px;top:-2px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:var(--raise);border-radius:99px;padding:5px 10px;font-size:12px}
.pill.on{border-color:var(--accent);color:var(--accent)}
.picked{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.picked i{width:18px;height:18px;border-radius:4px;border:1px solid var(--line)}

.trimtl{position:relative;height:56px;border-radius:6px;overflow:hidden;background:#000;touch-action:none;user-select:none}
.trimtl canvas{width:100%;height:100%;display:block}
.trimtl .shade{position:absolute;top:0;bottom:0;background:#000b}
.trimtl .win{position:absolute;top:0;bottom:0;border:2px solid var(--accent);border-left-width:10px;border-right-width:10px;border-radius:5px;box-sizing:border-box;pointer-events:none}
.trimtl .ph{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--fg);pointer-events:none}
.tcrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tcrow div{background:var(--raise);border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;gap:2px}
.tcrow span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.tcrow b{font:500 13px var(--mono);font-variant-numeric:tabular-nums}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}

.ideas{display:flex;flex-direction:column;gap:6px}
.idea{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:9px 10px;background:var(--raise);border-radius:8px}
.idea b{font-weight:600;font-size:13px}
.idea em{font-style:normal;font:10px var(--mono);color:var(--accent);text-transform:uppercase;letter-spacing:.08em;align-self:center}
.idea p{margin:0;grid-column:1/-1;font-size:12px;color:var(--muted);line-height:1.4}

/* export sheet */
.scrim{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(520px,100%);max-height:100%;overflow:auto;padding:20px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-size:22px;font-weight:800;font-stretch:75%;text-transform:uppercase;letter-spacing:.02em}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dest{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px dashed #4a433b;border-radius:8px;padding:10px}
.dest code{flex:1;font:12px var(--mono);color:var(--fg);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
input[type=text]{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:var(--mono);font-size:12px}
.chk{display:flex;gap:8px;align-items:center;font-size:13px}
.summary{font-size:12px;color:var(--muted);background:var(--bg);border-radius:8px;padding:10px;line-height:1.5}
.summary b{color:var(--fg)}
.prog{height:6px;border-radius:3px;background:var(--bg);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s}
.actions{display:flex;gap:8px;justify-content:flex-end}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-weight:600;font-size:13px;z-index:30;max-width:calc(100% - 32px)}

/* phone: tool bar at the bottom, tools open in a drawer */
.toolbar,.sheethead{display:none}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"top" "stage" "strip" "tools";gap:8px;padding-block:8px;transition:padding .25s}
  .app.sheet-open{padding-bottom:var(--sheetH,50%)}
  .app.sheet-open .stage{background:var(--bg)}
  .app.sheet-open .strip,.app.sheet-open .toolbar{visibility:hidden}
  .brand{font-size:19px}
  .folder span{display:none}
  .frame{padding:12px 4px}
  .frame canvas{width:72px;height:48px}
  .frame .no{display:none}
  .frame .vid{top:15px;left:7px;font-size:9px}
  .frame .ov{top:15px;right:7px}
  #view{max-width:100%;max-height:calc(100% - 8px)}
  .stagebar{left:8px;right:8px;bottom:8px}
  .toolbar{grid-area:tools;display:flex;gap:2px}
  .toolbar button{flex:1;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:6px 0;min-width:0}
  .toolbar button[hidden]{display:none}
  .toolbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .toolbar button.on{color:var(--fg)}
  .toolbar button.vid{color:var(--accent)}
  .panel{position:fixed;left:0;right:0;bottom:0;max-height:56%;border-radius:16px 16px 0 0;transform:translateY(105%);transition:transform .25s;z-index:10;box-shadow:0 -12px 40px #000c;padding-bottom:env(safe-area-inset-bottom,0px)}
  .panel.open{transform:none}
  .panel .tabs{display:none}
  .sheethead{display:flex;align-items:center;gap:10px;padding:14px 16px 4px;position:relative;touch-action:none}
  .sheethead::before{content:"";position:absolute;left:50%;top:6px;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--line)}
  .sheethead b{flex:1;font-size:17px;font-weight:800;font-stretch:80%;text-transform:uppercase;letter-spacing:.03em}
  .scope{padding:8px 16px 10px}
  .body{padding:12px 16px 16px}
  .toast{bottom:120px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand"><i></i>Filmlab</div>
    <div class="folder"><b id="folderName">Lofoten 2026</b><span id="folderMeta">12 elementer</span></div>
    <div class="sp"></div>
    <button class="btn primary" id="exportBtn">Eksporter</button>
  </header>

  <main class="stage" id="stage">
    <canvas id="view" width="900" height="600" aria-label="Forhåndsvisning. Hold for original, sveip for å bla."></canvas>
    <div class="chips" id="chips"></div>
    <div class="stagebar" id="stagebar" hidden>
      <button class="btn small" id="playBtn">▶ Spill</button>
      <span class="tc" id="stageTc"></span>
    </div>
  </main>

  <section class="strip">
    <div class="reel" id="reel"></div>
  </section>

  <nav class="toolbar" id="toolbar" aria-label="Verktøy">
    <button data-tab="looks"><svg viewBox="0 0 24 24"><circle cx="9" cy="10" r="5"/><circle cx="15" cy="10" r="5"/><circle cx="12" cy="15" r="5"/></svg>Looks</button>
    <button data-tab="light"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Lys</button>
    <button data-tab="color"><svg viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>Farge</button>
    <button data-tab="curves"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 21C9 21 9 3 21 3"/></svg>Kurver</button>
    <button data-tab="fx"><svg viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M12 9l1 2 2 1-2 1-1 2-1-2-2-1 2-1z"/></svg>Effekter</button>
    <button data-tab="trim" class="vid" hidden><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.5 7.5L20 18M8.5 16.5L20 6"/></svg>Trim</button>
  </nav>

  <aside class="panel" id="panel">
    <div class="sheethead" id="sheethead"><b id="sheetTitle">Looks</b><button class="btn small" id="sheetDone">Ferdig</button></div>
    <div class="scope">
      <div class="seg" role="tablist" aria-label="Hva endringene gjelder">
        <button data-scope="all" class="on" id="scopeAll">Alle bilder</button>
        <button data-scope="item" id="scopeItem">Bare dette</button>
      </div>
      <div class="scopenote" id="scopeNote"></div>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="looks" class="on">Looks</button>
      <button data-tab="light">Lys</button>
      <button data-tab="color">Farge</button>
      <button data-tab="curves">Kurver</button>
      <button data-tab="fx">Effekter</button>
      <button data-tab="trim" class="vid" hidden>Trim</button>
    </nav>
    <div class="body" id="body"></div>
  </aside>
</div>

<input type="file" id="fileIn" accept="image/*,video/*" multiple hidden>

<div class="scrim" id="exportScrim" hidden>
  <div class="sheet" role="dialog" aria-labelledby="exTitle">
    <h2 id="exTitle">Eksporter</h2>
    <div class="field"><span>Målmappe</span>
      <div class="dest"><code id="destPath">Ingen mappe valgt</code><button class="btn small" id="pickDest">Velg mappe…</button></div>
    </div>
    <div class="two">
      <label class="field"><span>Bilder</span><select id="exFmt"><option>JPEG</option><option>WebP</option><option>AVIF</option><option>PNG (16-bit)</option></select></label>
      <label class="field"><span>Video</span><select id="exVid"><option>MP4 · H.264</option><option>MP4 · HEVC</option><option>WebM · AV1</option></select></label>
    </div>
    <div class="two">
      <label class="field"><span>Størrelse</span><select id="exSize"><option>Original</option><option>4096 px lang side</option><option>2048 px lang side</option><option>1080 px lang side</option></select></label>
      <div class="field"><span>Kvalitet <b id="qv" style="font-family:var(--mono);font-weight:400">92</b></span><input type="range" id="exQ" min="50" max="100" value="92" style="--a:0%;--b:84%"></div>
    </div>
    <label class="field"><span>Filnavn</span><input type="text" id="exName" value="{navn}_filmlab"></label>
    <label class="chk"><input type="checkbox" id="exMeta" checked> Behold metadata (dato, kamera, GPS)</label>
    <div class="summary" id="exSummary"></div>
    <div class="prog" id="exProg" hidden><i></i></div>
    <div class="actions">
      <button class="btn ghost" id="exCancel">Avbryt</button>
      <button class="btn primary" id="exGo">Eksporter</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const PW = 900, PH = 600, TW = 162, TH = 108;

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function canvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}

function grad(c,x0,y0,x1,y1,stops){const g=c.createLinearGradient(x0,y0,x1,y1);stops.forEach(([o,col])=>g.addColorStop(o,col));return g}
function ridge(c,w,h,base,amp,col,R,n=9){c.fillStyle=col;c.beginPath();c.moveTo(0,h);c.lineTo(0,base-amp*R()*.4);let x=0;while(x<w){x+=w/n*(.4+R()*.7);c.lineTo(x,base-amp*(.35+R()*.65));x+=w/n*(.3+R()*.6);c.lineTo(x,base-amp*R()*.35)}c.lineTo(w,h);c.closePath();c.fill()}
function reflect(c,w,h,y,a=.45,tint='#0a1a2a'){c.save();c.globalAlpha=a;c.translate(0,2*y);c.scale(1,-1);c.drawImage(c.canvas,0,y-(h-y),w,h-y,0,y-(h-y),w,h-y);c.restore();c.save();c.globalAlpha=.35;c.fillStyle=tint;c.fillRect(0,y,w,h-y);c.restore();c.fillStyle='#ffffff18';for(let i=0;i<40;i++){c.fillRect(Math.random()*w,y+Math.random()*(h-y),20+Math.random()*80,1)}}
function stars(c,w,h,R,n=160){c.fillStyle='#fff';for(let i=0;i<n;i++){c.globalAlpha=.3+R()*.7;c.fillRect(R()*w,R()*h*.6,1.4,1.4)}c.globalAlpha=1}
function cabin(c,x,y,s,col,lit){c.fillStyle='#2a1a14';c.fillRect(x+s*.1,y+s*.6,s*.06,s*.5);c.fillRect(x+s*.84,y+s*.6,s*.06,s*.5);c.fillStyle=col;c.fillRect(x,y,s,s*.62);c.fillStyle='#1d1b1f';c.beginPath();c.moveTo(x-s*.08,y);c.lineTo(x+s/2,y-s*.38);c.lineTo(x+s*1.08,y);c.fill();c.fillStyle=lit?'#ffd27a':'#f2efe8';c.fillRect(x+s*.18,y+s*.18,s*.2,s*.2);c.fillRect(x+s*.62,y+s*.18,s*.2,s*.2);c.fillStyle='#f2efe8';c.fillRect(x+s*.44,y+s*.22,s*.12,s*.4)}

function drawSource(it,w,h){
  const c=canvas(w,h),x=c.getContext('2d',{willReadFrequently:true});
  if(it.media){const m=it.media,mw=m.videoWidth||m.width,mh=m.videoHeight||m.height;const s=Math.max(w/mw,h/mh);x.drawImage(m,(w-mw*s)/2,(h-mh*s)/2,mw*s,mh*s)}
  else{const R=rng(it.seed);x.save();x.scale(w/PW,h/PH);SCENES[it.scene](x,PW,PH,R,it.t,{blue:it.blue,video:it.video});x.restore()}
  const d=x.getImageData(0,0,w,h);
  if(it.ev){const f=Math.pow(2,it.ev*.85),a=d.data;for(let i=0;i<a.length;i+=4){a[i]*=f;a[i+1]*=f;a[i+2]*=f}}
  return d;
}
function sizeFor(it,maxW,maxH){const mw=it.media?(it.media.videoWidth||it.media.width):PW,mh=it.media?(it.media.videoHeight||it.media.height):PH;const s=Math.min(maxW/mw,maxH/mh);return[Math.round(mw*s),Math.round(mh*s)]}
function refreshSrc(it){const[w,h]=sizeFor(it,PW,PH);it.src=drawSource(it,w,h);if(!it.thumbSrc||!it.video||it.media){const[tw,th]=[TW,TH];it.thumbSrc=drawSource(it,tw,th)}}

  const p=pts.slice().sort((a,b)=>a[0]-b[0]),n=p.length,lut=new Float32Array(256);
  const xs=p.map(q=>q[0]),ys=p.map(q=>q[1]),d=[],m=[];
  for(let i=0;i<n-1;i++)d[i]=(ys[i+1]-ys[i])/Math.max(1e-6,xs[i+1]-xs[i]);
  m[0]=d[0];m[n-1]=d[n-2];for(let i=1;i<n-1;i++)m[i]=d[i-1]*d[i]<=0?0:(d[i-1]+d[i])/2;
  for(let i=0;i<n-1;i++){if(d[i]===0){m[i]=m[i+1]=0;continue}const a=m[i]/d[i],b=m[i+1]/d[i],s=a*a+b*b;if(s>9){const tt=3/Math.sqrt(s);m[i]=tt*a*d[i];m[i+1]=tt*b*d[i]}}
  let i=0;for(let k=0;k<256;k++){const x=k/255;if(x<=xs[0]){lut[k]=ys[0];continue}if(x>=xs[n-1]){lut[k]=ys[n-1];continue}
    while(i<n-2&&x>xs[i+1])i++;const hh=xs[i+1]-xs[i],t=(x-xs[i])/hh,t2=t*t,t3=t2*t;
    lut[k]=clamp((2*t3-3*t2+1)*ys[i]+(t3-2*t2+t)*hh*m[i]+(-2*t3+3*t2)*ys[i+1]+(t3-t2)*hh*m[i+1])}
  return lut;
}
function finalLUTs(P){
  const c=P.curves,L=curveLUT(c.rgb),out=[];const fade=P.fade/100*.22,bl=P.blacks/100*.12,wh=P.whites/100*.12;
  for(const ch of['r','g','b']){const C=curveLUT(c[ch]),o=new Uint8ClampedArray(256);
    for(let k=0;k<256;k++){let v=C[Math.round(L[k]*255)];v=v*(1+wh-bl)+bl;v=fade+v*(1-fade);o[k]=Math.round(clamp(v)*255)}out.push(o)}
  return out;
}

function buf(w,h){const k=w+'x'+h;if(bufs[k])return bufs[k];const R=rng(7),n=new Float32Array(w*h);for(let i=0;i<n.length;i++)n[i]=(R()+R()+R()-1.5)*1.2;

function render(cv,src,P,opt={}){

  const fd=FMAP[P.filter.id],F=fd&&fd.v?Object.assign({},fd.v,P.filter.v||{}):null,fk=F?P.filter.k/100:0;

        const fc=1+F.con/100*.7;r=(r-.45)*fc+.45;g=(g-.45)*fc+.45;b=(b-.45)*fc+.45;

        if(fd.mono){r=g=b=.3*r+.59*g+.11*b;l=r}else{const sv=1+F.sat/100;r=l+(r-l)*sv;g=l+(g-l)*sv;b=l+(b-l)*sv}
        if(F.split){const lc=clamp(l),ws=(1-lc)*(1-lc),wh=lc*lc,a=F.split/100*.32;r+=a*(ws*(fs[0]-.5)+wh*(fh[0]-.5));g+=a*(ws*(fs[1]-.5)+wh*(fh[1]-.5));b+=a*(ws*(fs[2]-.5)+wh*(fh[2]-.5))}

        if(dd>.01){const S=L>.5?dd/(2-mx-mn):dd/(mx+mn);let H=mx===r?(g-b)/dd+(g<b?6:0):mx===g?(b-r)/dd+2:(r-g)/dd+4;H*=60;
          let dh=0,ds=0,dl=0;for(let k=0;k<8;k++){const bb=hsl[k];if(!bb.h&&!bb.s&&!bb.l)continue;let df=Math.abs(H-BANDS[k].h);if(df>180)df=360-df;const wt=df<42?1-df/42:0;if(wt){dh+=bb.h*wt;ds+=bb.s*wt;dl+=bb.l*wt}}
          if(dh||ds||dl){const nS=clamp(S*(1+ds/100)),nL=clamp(L+dl/100*.3*S);[r,g,b]=hsl2rgb((((H+dh)%360)+360)%360/360,nS,nL)}}}
      let R=Lr[(r*255+.5)|0],Gc=Lg[(g*255+.5)|0],Bc=Lb[(b*255+.5)|0];
      if(vig){const nx=(x/w-.5)*2,dist=Math.sqrt(nx*nx+ny2)/1.4142;let f=(dist-vin)/(1.05-vin);if(f>0){f=f>1?1:f*f*(3-2*f);if(vig>0){const m=1-vig*f;R*=m;Gc*=m;Bc*=m}else{const m=-vig*f;R+=(255-R)*m;Gc+=(255-Gc)*m;Bc+=(255-Bc)*m}}}

      d[i]=R;d[i+1]=Gc;d[i+2]=Bc;d[i+3]=255;

function glow(ctx,B,srcC,w,h,amount,radius,steps){

function slider(parent,{key,label,min,max,step=1,unit='',get,set,ovKey}){
  const row=document.createElement('div');row.className='row';const id='s_'+(ovKey||key)+'_'+label.replace(/\W/g,'');const ok=ovKey||key;
  const val=get?get():getV(key);
  row.innerHTML=`<label for="${id}" title="Dobbeltklikk for å nullstille"><i class="d"></i>${label}</label><output>${fmt(val,step,unit)}</output><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}">`;
  const note=()=>{const o=curIt().override,on=scope==='item'&&ok in o;row.classList.toggle('ovr',on);let sm=row.querySelector('small');
    const txt=on&&NUM[ok]?`${fmt(o[ok],step,unit)} i forhold til alle`:on?'Egen verdi for dette bildet':scope==='all'&&ovrCountFor(ok)?`${ovrCountFor(ok)} har egen justering i tillegg`:'';
    if(!txt){sm&&sm.remove();return}if(!sm){sm=document.createElement('small');row.appendChild(sm)}sm.textContent=txt};
  const inp=row.querySelector('input'),out=row.querySelector('output');setFill(inp);note();

  const s2=sec('Batch');const p=document.createElement('p');p.className='hint';p.style.margin=0;p.textContent='Auto-match måler snittlysstyrken i hvert bilde og setter en egen eksponering på de som avviker, slik at serien blir jevn.';s2.appendChild(p);

function pCurves(){
  const s=sec('RGB-kurver');const sel=document.createElement('select');sel.id='curvePreset';sel.innerHTML='<option value="">Kurve-preset…</option>'+Object.keys(CURVES).map(n=>`<option>${n}</option>`).join('');
  sel.onchange=()=>{if(sel.value){setV('curves',clone(CURVES[sel.value]));renderPreview()}};s.appendChild(sel);
  const ch=document.createElement('div');ch.className='chans';['rgb','r','g','b'].forEach(c=>{const b=document.createElement('button');b.dataset.c=c;b.textContent=c.toUpperCase();b.className=c===curveCh?'on':'';b.onclick=()=>{curveCh=c;[...ch.children].forEach(x=>x.classList.toggle('on',x===b));renderPreview()};ch.appendChild(b)});s.appendChild(ch);
  const wrap=document.createElement('div');wrap.className='curvewrap';wrap.innerHTML='<canvas id="curve" width="560" height="560"></canvas>';s.appendChild(wrap);
  const h=document.createElement('p');h.className='hint';h.style.margin=0;h.textContent='Trykk for å legge til punkt · dra for å flytte · dobbeltklikk for å fjerne.';s.appendChild(h);
  const b=document.createElement('button');b.className='btn small';b.textContent='Nullstill kurve';b.onclick=()=>{const c=clone(getV('curves'));c[curveCh]=LIN;setV('curves',c);renderPreview()};s.appendChild(b);
  curveEvents($('#curve'));
}
function drawCurve(){const cv=$('#curve');if(!cv)return;const c=cv.getContext('2d'),W=cv.width,H=cv.height;c.clearRect(0,0,W,H);
  c.strokeStyle='#2f2a25';c.lineWidth=1;for(let i=1;i<4;i++){c.beginPath();c.moveTo(i*W/4,0);c.lineTo(i*W/4,H);c.moveTo(0,i*H/4);c.lineTo(W,i*H/4);c.stroke()}
  c.strokeStyle='#ffffff22';c.setLineDash([4,6]);c.beginPath();c.moveTo(0,H);c.lineTo(W,0);c.stroke();c.setLineDash([]);
  const cs=getV('curves'),col={rgb:'#ece5d9',r:'#ff6a5a',g:'#6fd27c',b:'#6aa6ff'};
  ['r','g','b','rgb'].forEach(k=>{if(k===curveCh)return;const L=curveLUT(cs[k]);if(cs[k].length===2&&cs[k][0][1]===0&&cs[k][1][1]===1)return;c.strokeStyle=col[k]+'55';c.lineWidth=2;c.beginPath();for(let i=0;i<256;i++)c.lineTo(i/255*W,H-L[i]*H);c.stroke()});
  const L=curveLUT(cs[curveCh]);c.strokeStyle=col[curveCh];c.lineWidth=3;c.beginPath();for(let i=0;i<256;i++)c.lineTo(i/255*W,H-L[i]*H);c.stroke();
  cs[curveCh].forEach(p=>{c.fillStyle='#171513';c.strokeStyle=col[curveCh];c.lineWidth=3;c.beginPath();c.arc(p[0]*W,H-p[1]*H,9,0,7);c.fill();c.stroke()})}
function curveEvents(cv){let drag=-1;const pos=e=>{const r=cv.getBoundingClientRect();return[clamp((e.clientX-r.left)/r.width),clamp(1-(e.clientY-r.top)/r.height)]};
  const pts=()=>clone(getV('curves'));
  cv.onpointerdown=e=>{const[x,y]=pos(e),c=pts(),a=c[curveCh];let best=-1,bd=.05;a.forEach((p,i)=>{const d=Math.hypot(p[0]-x,p[1]-y);if(d<bd){bd=d;best=i}});
    if(best<0){a.push([x,y]);a.sort((p,q)=>p[0]-q[0]);best=a.findIndex(p=>p[0]===x);setV('curves',c)}drag=best;cv.setPointerCapture(e.pointerId);drawCurve()};
  cv.onpointermove=e=>{if(drag<0)return;const[x,y]=pos(e),c=pts(),a=c[curveCh];const lo=drag>0?a[drag-1][0]+.01:0,hi=drag<a.length-1?a[drag+1][0]-.01:1;a[drag]=[drag===0?Math.min(x,hi):drag===a.length-1?Math.max(x,lo):clamp(x,lo,hi),y];setV('curves',c);drawCurve()};
  cv.onpointerup=()=>drag=-1;
  cv.ondblclick=e=>{const[x,y]=pos(e),c=pts(),a=c[curveCh];const i=a.findIndex(p=>Math.hypot(p[0]-x,p[1]-y)<.05);if(i>0&&i<a.length-1){a.splice(i,1);setV('curves',c);drawCurve()}}}

  const g=sec('Korn','filmkorn, midtone-vektet');slider(g,{key:'grain',label:'Mengde',min:0,max:100});slider(g,{key:'grainSize',label:'Størrelse',min:1,max:4,step:.1,unit:'x'});
  const b=sec('Blur');const bm=document.createElement('div');bm.className='pills';[['tilt','Tilt-shift'],['radial','Radial'],['full','Hele bildet']].forEach(([k,n])=>{const p=document.createElement('button');p.className='pill'+(getV('blurMode')===k?' on':'');p.textContent=n;p.onclick=()=>{setV('blurMode',k);buildPanel()};bm.appendChild(p)});b.appendChild(bm);

/* trim */
const fmtT=(s,dec=1)=>{s=Math.max(0,s);const m=Math.floor(s/60),r=s-m*60;return m+':'+(dec?r.toFixed(dec).padStart(4,'0'):String(Math.round(r)).padStart(2,'0'))};
function pTrim(){const it=curIt();if(!it.video)return;
  const s=sec('Trim',fmtT(it.dur)+' totalt');
  s.insertAdjacentHTML('beforeend',`<div class="trimtl" id="tl"><canvas width="600" height="112"></canvas><div class="shade" id="shL"></div><div class="shade" id="shR"></div><div class="win" id="win"></div><div class="ph" id="ph"></div></div>
  <div class="tcrow"><div><span>Start</span><b id="tIn"></b></div><div><span>Slutt</span><b id="tOut"></b></div><div><span>Lengde</span><b id="tLen"></b></div></div>
  <div class="btnrow"><button class="btn small" id="setIn">Sett start her</button><button class="btn small" id="setOut">Sett slutt her</button><button class="btn small ghost" id="trimReset">Nullstill</button></div>
  <p class="hint" style="margin:0">Dra i de gule håndtakene. Dra i midten for å flytte spillehodet.</p>`);
  const cv=s.querySelector('canvas'),c=cv.getContext('2d');const n=8,fw=cv.width/n;const keep=it.t;
  for(let i=0;i<n;i++){it.t=(i+.5)/n*it.dur;const d=drawSource(it,TW,TH);const tmp=canvas(TW,TH);render(tmp,d,eff(it),{noFx:true});c.drawImage(tmp,0,0,TW,TH,i*fw,0,fw,cv.height)}it.t=keep;
  const tl=$('#tl');let mode=null;
  const tAt=e=>{const r=tl.getBoundingClientRect();return clamp((e.clientX-r.left)/r.width)*it.dur};
  tl.onpointerdown=e=>{const t=tAt(e),px=it.dur/tl.getBoundingClientRect().width*18;mode=Math.abs(t-it.trim.in)<px?'in':Math.abs(t-it.trim.out)<px?'out':'ph';tl.setPointerCapture(e.pointerId);move(e)};
  const move=e=>{if(!mode)return;const t=tAt(e);if(mode==='in')it.trim.in=Math.min(t,it.trim.out-.5),seek(it.trim.in);else if(mode==='out')it.trim.out=Math.max(t,it.trim.in+.5),seek(it.trim.out);else seek(t);layoutTrim()};
  tl.onpointermove=move;tl.onpointerup=()=>{mode=null;renderThumbs()};
  $('#setIn').onclick=()=>{it.trim.in=Math.min(it.t,it.trim.out-.5);layoutTrim();renderThumbs()};
  $('#setOut').onclick=()=>{it.trim.out=Math.max(it.t,it.trim.in+.5);layoutTrim();renderThumbs()};
  $('#trimReset').onclick=()=>{it.trim={in:0,out:it.dur};layoutTrim();renderThumbs()};
  layoutTrim();
}
function layoutTrim(){const it=curIt(),tl=$('#tl');if(!tl)return;const p=v=>v/it.dur*100+'%';
  $('#shL').style.cssText=`left:0;width:${p(it.trim.in)}`;$('#shR').style.cssText=`left:${p(it.trim.out)};right:0`;$('#win').style.cssText=`left:${p(it.trim.in)};width:calc(${p(it.trim.out-it.trim.in)})`;$('#ph').style.left=p(it.t);
  $('#tIn').textContent=fmtT(it.trim.in);$('#tOut').textContent=fmtT(it.trim.out);$('#tLen').textContent=fmtT(it.trim.out-it.trim.in);updateTc()}
function updateTc(){const it=curIt();$('#stageTc').textContent=it.video?`${fmtT(it.t)} / ${fmtT(it.dur)} · trim ${fmtT(it.trim.in)}–${fmtT(it.trim.out)}`:''}
function seek(t){const it=curIt();it.t=clamp(t,0,it.dur);if(it.media&&it.media.tagName==='VIDEO'){it.media.currentTime=it.t;return}const[w,h]=sizeFor(it,PW,PH);it.src=drawSource(it,w,h);changedPreviewOnly()}
function changedPreviewOnly(){if(!raf)raf=requestAnimationFrame(()=>{raf=0;renderPreview()});updateTc();const ph=$('#ph');if(ph)ph.style.left=curIt().t/curIt().dur*100+'%'}
let last=0;
function loop(ts){if(!playing)return;const it=curIt(),dt=last?(ts-last)/1000:0;last=ts;
  if(it.media&&it.media.tagName==='VIDEO'){it.t=it.media.currentTime;if(it.t>=it.trim.out){it.media.currentTime=it.trim.in}const[w,h]=sizeFor(it,PW,PH);it.src=drawSource(it,w,h);changedPreviewOnly()}
  else{let t=it.t+dt;if(t>it.trim.out||t<it.trim.in)t=it.trim.in;seek(t)}requestAnimationFrame(loop)}
function startPlay(){const it=curIt();if(!it.video)return;playing=true;last=0;$('#playBtn').textContent='❚❚ Pause';if(it.t<it.trim.in||it.t>=it.trim.out)it.t=it.trim.in;if(it.media&&it.media.play){it.media.currentTime=it.t;it.media.play().catch(()=>{})}requestAnimationFrame(loop)}
function stopPlay(){playing=false;$('#playBtn').textContent='▶ Spill';const it=curIt();if(it&&it.media&&it.media.pause)it.media.pause()}
$('#playBtn').onclick=()=>playing?stopPlay():startPlay();

/* auto-match */
function autoMatch(){const target=.36;let n=0;
  ITEMS.forEach(it=>{if(!it.thumbSrc)refreshSrc(it);const a=it.thumbSrc.data;let sum=0;for(let i=0;i<a.length;i+=4)sum+=(.2126*a[i]+.7152*a[i+1]+.0722*a[i+2])/255;const mean=Math.max(.02,sum/(a.length/4));
    let ev=Math.round(clamp(Math.log2(target/mean)*.8,-2.5,2.5)*20)/20;
    if(Math.abs(ev)>=.25){it.override.exposure=ev;n++}else delete it.override.exposure});
  changed();buildPanel();toast(n?`Justerte eksponeringen på ${n} elementer`:'Alt var allerede jevnt eksponert')}

/* before/after, picking, keys */
const before=v=>{if(showBefore===v)return;showBefore=v;renderPreview();updateMeta()};
/* on the image: press and hold shows the original, swipe flips to the next/previous item */
{let x0=null,hold=0;
 view.addEventListener('pointerdown',e=>{if(picking)return;x0=e.clientX;view.setPointerCapture(e.pointerId);hold=setTimeout(()=>before(true),200)});
 view.addEventListener('pointermove',e=>{if(x0!=null&&Math.abs(e.clientX-x0)>12)clearTimeout(hold)});
 const end=e=>{clearTimeout(hold);if(x0==null)return;const dx=e.clientX-x0;x0=null;if(showBefore)return before(false);if(Math.abs(dx)>50)select(cur+(dx<0?1:-1))};
 view.addEventListener('pointerup',end);view.addEventListener('pointercancel',end);}
view.addEventListener('pointerdown',e=>{if(!picking)return;const r=view.getBoundingClientRect(),x=((e.clientX-r.left)/r.width*view.width)|0,y=((e.clientY-r.top)/r.height*view.height)|0;
  const p=view.getContext('2d').getImageData(x,y,1,1).data,mx=Math.max(p[0],p[1],p[2]),mn=Math.min(p[0],p[1],p[2]),d=mx-mn;let H=0;if(d){H=mx===p[0]?((p[1]-p[2])/d+6)%6:mx===p[1]?(p[2]-p[0])/d+2:(p[0]-p[1])/d+4;H*=60}
  let best=0,bd=999;BANDS.forEach((B,k)=>{let df=Math.abs(H-B.h);if(df>180)df=360-df;if(df<bd){bd=df;best=k}});band=best;picking=false;$('#stage').classList.remove('picking');buildPanel();toast(`Valgte ${BANDS[best].n.toLowerCase()} fra bildet`)});
document.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea'))return;if(e.key==='ArrowRight')select(cur+1);else if(e.key==='ArrowLeft')select(cur-1);else if((e.key==='b'||e.key==='B')&&!e.repeat)before(true);else if(e.key===' '&&curIt().video){e.preventDefault();playing?stopPlay():startPlay()}});
document.addEventListener('keyup',e=>{if(e.key==='b'||e.key==='B')before(false)});

/* import */
$('#fileIn').onchange=async e=>{const files=[...e.target.files];let added=0;
  for(const f of files){try{
    if(f.type.startsWith('video/')){const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=URL.createObjectURL(f);
      await new Promise((ok,no)=>{v.onloadeddata=ok;v.onerror=no});await new Promise(ok=>{v.onseeked=ok;v.currentTime=Math.min(.5,v.duration/3)});
      const it={id:ITEMS.length,name:f.name,video:true,media:v,dur:v.duration,ev:0,override:{},t:v.currentTime,trim:{in:0,out:v.duration}};v.onseeked=()=>{if(curIt()===it){const[w,h]=sizeFor(it,PW,PH);it.src=drawSource(it,w,h);changedPreviewOnly()}};ITEMS.push(it);refreshSrc(it);added++}
    else{const bm=await createImageBitmap(f);const it={id:ITEMS.length,name:f.name,media:bm,ev:0,override:{},t:0};ITEMS.push(it);refreshSrc(it);added++}
  }catch(err){toast('Kunne ikke lese '+f.name)}}
  e.target.value='';if(added){$('#folderName').textContent='Lofoten 2026 + egne filer';buildReel();select(ITEMS.length-added);toast(`La til ${added} ${added>1?'filer':'fil'}`)}};

/* export */

  $('#exSummary').innerHTML=`<b>${ITEMS.length-v.length} bilder</b> og <b>${v.length} videoer</b> med look «${FMAP[G.filter.id].name}».<br>${o.length} har egne overstyringer · ${t.length} videoer er trimmet (${fmtT(v.reduce((a,x)=>a+x.dur,0),0)} → ${fmtT(v.reduce((a,x)=>a+x.trim.out-x.trim.in,0),0)}).<br>Eksempel: <b style="font-family:var(--mono);font-weight:400">${$('#exName').value.replace('{navn}',ITEMS[0].name.replace(/\..*/,''))}.${$('#exFmt').value.split(' ')[0].toLowerCase().replace('jpeg','jpg')}</b>`;
  $('#exGo').textContent=`Eksporter ${ITEMS.length} filer`}
$('#exportBtn').onclick=()=>{stopPlay();scrim.hidden=false;$('#exProg').hidden=true;exSummary()};
$('#exCancel').onclick=()=>scrim.hidden=true;scrim.onclick=e=>{if(e.target===scrim)scrim.hidden=true};
['exFmt','exName'].forEach(id=>$('#'+id).oninput=exSummary);
$('#exQ').oninput=e=>{$('#qv').textContent=e.target.value;setFill(e.target)};
$('#pickDest').onclick=async()=>{try{if(window.showDirectoryPicker){const h=await window.showDirectoryPicker({mode:'readwrite'});dest=h.name}else throw 0}catch(err){dest='Bilder/Lofoten 2026/Filmlab'}$('#destPath').textContent=dest};
$('#exGo').onclick=async()=>{if(!dest){$('#destPath').textContent='Velg en målmappe først';$('#destPath').style.color='var(--warn)';return}
  $('#destPath').style.color='';const pr=$('#exProg');pr.hidden=false;const bar=pr.firstElementChild;$('#exGo').disabled=true;
  for(let i=0;i<ITEMS.length;i++){$('#exGo').textContent=`Lagrer ${ITEMS[i].name}…`;await new Promise(r=>setTimeout(r,ITEMS[i].video?500:110));bar.style.width=((i+1)/ITEMS.length*100)+'%'}
  $('#exGo').disabled=false;scrim.hidden=true;toast(`${ITEMS.length} filer lagret i ${dest}`)};

let tt=0;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2400)}

/* boot: one example override so the concept is visible from the start */
ITEMS[4].override={exposure:1.25,shadows:20};
ITEMS[9].override={exposure:1.1,temp:-15};
buildReel();select(0);setTimeout(()=>toast('Hold på bildet for original · sveip for å bla'),600);
